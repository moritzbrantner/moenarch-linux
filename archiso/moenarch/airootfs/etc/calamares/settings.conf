# Use the existing Calamares workflow, not a Moenarch partitioning framework.
modules-search: [ local ]
instances:
  - id: finalize-moenarch
    module: shellprocess
    config: shellprocess-finalize-moenarch.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - shellprocess@finalize-moenarch
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished
branding: moenarch
prompt-install: true
