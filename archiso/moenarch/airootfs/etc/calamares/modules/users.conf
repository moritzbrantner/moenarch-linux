# Installed login always requires a local account password.
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - video
  - audio
  - storage
  - network
  - name: wheel
    must_exist: true
    system: true
sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: false
displayAutologin: false
doAutologin: false
passwordRequirements:
  minLength: 8
  maxLength: 128
allowWeakPasswords: false
allowWeakPasswordsDefault: false
