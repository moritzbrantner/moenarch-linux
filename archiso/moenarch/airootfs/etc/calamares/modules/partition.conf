# Whole-disk UEFI layout. The vendored upstream patch also hides the
# unsupported alongside/replace buttons; disabling manual alone does not.
# Never pre-select a destructive action or the encryption checkbox.
efi:
  mountPoint: /boot
  recommendedSize: 1024MiB
  minimumSize: 1024MiB
  label: MOENARCH_EFI
userSwapChoices: [ none ]
initialSwapChoice: none
initialPartitioningChoice: none
allowManualPartitioning: false
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
luksGeneration: luks2
defaultPartitionTableType: gpt
requiredPartitionTableType: [ gpt ]
defaultFileSystemType: btrfs
availableFileSystemTypes: [ btrfs ]
lvm:
  enable: false
