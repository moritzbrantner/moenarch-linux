# systemd-boot reads unencrypted /boot ESP; LUKS2 root is unlocked
# in initramfs, leaving all home files encrypted together with root.
efiBootLoader: systemd-boot
kernelSearchPath: /usr/lib/modules
kernelPattern: "^vmlinuz.*"
loaderEntries: [ "timeout 5", "console-mode keep" ]
kernelParams: [ quiet ]
installEFIFallback: true
