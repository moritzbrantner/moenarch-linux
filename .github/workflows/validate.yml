name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate deterministic contracts
        run: make validate
      - name: Shellcheck
        run: |
          shellcheck \
            archiso/moenarch/profiledef.sh \
            archiso/moenarch/airootfs/usr/local/lib/moenarch/finalize-live-root \
            archiso/moenarch/airootfs/usr/local/lib/moenarch/autoinstall \
            archiso/moenarch/airootfs/usr/local/bin/moenarch-projects \
            archiso/moenarch/airootfs/usr/local/bin/moenarch-boot-marker \
            archiso/moenarch/airootfs/usr/local/bin/moenarch-installed-boot-marker \
            scripts/prepare-profile \
            scripts/build-iso \
            scripts/test-iso-boot \
            scripts/test-installed-system \
            tests/validate-profile \
            tests/test-project-workspace

  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Moenarch ISO with Archiso
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc 'pacman -Syu --noconfirm --needed archiso git && git config --global --add safe.directory /workspace && ./scripts/build-iso'
      - name: Install VM test tooling
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools qemu-system-x86 qemu-utils
      - name: Boot and verify live distribution identity
        run: ./scripts/test-iso-boot
      - name: Install and boot from a blank virtual disk
        run: ./scripts/test-installed-system
      - name: Upload ISO evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moenarch-linux-iso
          path: |
            out/*.iso
            out/SHA256SUMS
            out/build-manifest.txt
          if-no-files-found: error
