name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate profile contracts
        run: ./tests/validate-profile
      - name: Shellcheck
        run: |
          shellcheck \
            archiso/moenarch/profiledef.sh \
            archiso/moenarch/airootfs/usr/local/lib/moenarch/finalize-live-root \
            archiso/moenarch/airootfs/usr/local/bin/moenarch-boot-marker \
            scripts/prepare-profile \
            scripts/build-iso \
            scripts/test-iso-boot \
            tests/validate-profile

  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Moenarch ISO with Archiso
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc 'pacman -Syu --noconfirm --needed archiso git && git config --global --add safe.directory /workspace && ./scripts/build-iso'
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot and verify distribution identity
        run: ./scripts/test-iso-boot
      - name: Upload ISO evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: moenarch-linux-iso
          path: |
            out/*.iso
            out/SHA256SUMS
            out/build-manifest.txt
          if-no-files-found: error

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["static", "iso"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["static", "iso"]'
